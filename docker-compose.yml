# Project name fixes the container name to bookhunt-app-1 regardless of the
# directory the compose file lives in.
name: bookhunt

services:
  app:
    build:
      context: .
      args:
        # Stamp the running build's commit + time (see the `docker:up` npm
        # script, which exports these). Default blank when built directly.
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ericfaris/bookhunt:latest
    restart: unless-stopped
    # Run as the host user (uid:gid 1000) so the bind-mounted browser profile,
    # history, and downloads stay owned by you — never root.
    user: "1000:1000"
    # Block privilege escalation (setuid binaries can't gain new privs).
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persistent browser profile — keeps Cloudflare clearance + Mobilism session
      # between container restarts. Pre-populate by running the app once outside
      # Docker with `DISPLAY=:0 npm start` so the profile is already authenticated.
      - ./.browser-profile:/app/.browser-profile
      # Search + download history
      - ./history.json:/app/history.json
      # Notification recipients (name / email / kindle email / phone / carrier)
      - ./recipients.json:/app/recipients.json
      # Recipient groups (presets) + per-book tags/collections
      - ./recipient-groups.json:/app/recipient-groups.json
      - ./booktags.json:/app/booktags.json
      # Library cover-URL cache (so each book is looked up at most once,
      # persisted across restarts; /app is root-owned, this isn't writable
      # by the uid-1000 process otherwise)
      - ./covers-cache.json:/app/covers-cache.json
      # Watchlist (saved searches the background watcher re-checks) — same
      # single-file bind so the uid-1000 process can write it under root-owned /app
      - ./watchlist.json:/app/watchlist.json
      # User-tunable settings (e.g. watchlist re-check cadence)
      - ./settings.json:/app/settings.json
      # Downloads land in C:\epubs on the Windows side (via WSL2 path)
      - /mnt/c/epubs:/downloads
    environment:
      # Forum login credentials — read from .env
      - MOBILISM_USER=${MOBILISM_USER}
      - MOBILISM_PASS=${MOBILISM_PASS}
      # Optional: premium downloader login (loaded at startup; UI form overrides)
      - MOBILISM_PREMIUM_USER=${MOBILISM_PREMIUM_USER:-}
      - MOBILISM_PREMIUM_PASS=${MOBILISM_PREMIUM_PASS:-}
      # Cloudflare Access origin verification — makes the app fail closed even if
      # the tunnel is reached directly or the Access policy is loosened.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CF_ACCESS_ALLOWED_EMAILS=${CF_ACCESS_ALLOWED_EMAILS:-}
      # Optional: Google Books key for stronger spell-correction (keyless Open
      # Library is the fallback). See .env.example.
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      # Notifications + Send-to-Kindle (Gmail SMTP); TWILIO_* reserved for later
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      # Server binding — 0.0.0.0 inside the container; the ports mapping above
      # restricts host-side exposure to 127.0.0.1
      - HOST=0.0.0.0
      - PORT=3000
      - DOWNLOAD_PATH=/downloads
      # Headed under a virtual display (Xvfb, started by entrypoint.sh) — Mobilism's
      # Cloudflare blocks headless browsers, so Chromium runs headed in-container and
      # is warmed remotely via /warm (noVNC). No host `npm run warm` step anymore.
      - DISPLAY=:99
