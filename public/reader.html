<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your BookHunt Library</title>
<meta name="theme-color" content="#1c2a56">
<!-- Home-screen install. The <link rel="manifest"> is injected by reader.js so
     it can carry the reader's token (Android/Chrome). iOS uses these apple-*
     tags + captures the current URL, so the token rides along there too. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BookHunt">
<link rel="apple-touch-icon" href="/reader/icon-180.png">
<link rel="icon" href="/reader/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f6f1e7; --surface: #fffdf8; --text: #1c2a56; --dim: #616a8c;
    --border: #e7ddc8; --accent: #f1592a; --accent-hover: #d8481c; --good: #1a7f47; --err: #b03224;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a30; --surface: #1b2440; --text: #eef1fa; --dim: #9aa3c4; --border: #2b3557;
      --good: #4cc47f; --err: #ff8a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; margin: 10px 0 22px; }
  header .logo { font-size: 1.5rem; font-weight: 800; display: inline-flex; align-items: center; gap: 10px; }
  header .logo .mark { width: 30px; height: 34px; color: var(--text); flex: 0 0 auto; }
  header .logo em { color: var(--accent); font-style: normal; }
  header p { color: var(--dim); margin: 6px 0 0; font-size: 0.95rem; }
  .note { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin: 0 0 16px; font-size: 0.95rem; }
  .note.warn { border-color: #c2871c; }
  .note button.add { border: 0; border-radius: 9px; padding: 9px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; }
  .note button.plain { border: 1px solid var(--border); border-radius: 9px; padding: 8px 14px;
    font-size: 0.85rem; cursor: pointer; background: none; color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px;
    background: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
  .cover.ph { display: flex; align-items: center; justify-content: center; font-size: 2rem; }
  .t { font-weight: 700; font-size: 0.9rem; line-height: 1.25; }
  .a { color: var(--dim); font-size: 0.8rem; }
  button.send { margin-top: auto; border: 0; border-radius: 9px; padding: 10px 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; }
  button.send:hover:not(:disabled) { background: var(--accent-hover); }
  button.send:disabled { opacity: 0.85; cursor: default; }
  /* Sent: a quiet outline, not another loud call to action. On a tile it opens
     the details; in the modal "Send again" is the deliberate re-send. */
  button.send.sent, button.send.again { background: transparent; color: var(--good);
    box-shadow: inset 0 0 0 1.5px currentColor; }
  button.send.again { color: var(--text); }
  button.send.sent:hover:not(:disabled), button.send.again:hover:not(:disabled) { background: var(--bg); }
  .err { color: var(--err); font-size: 0.8rem; }
  .err:empty { display: none; }
  /* Gentle, dismissable "add to home screen" hint — never a blocker. */
  .install { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; }
  .install[hidden] { display: none; }
  .install img { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; }
  .install .it { flex: 1; min-width: 0; }
  .install .it b { display: block; font-size: 0.95rem; }
  .install .it span { font-size: 0.82rem; color: var(--dim); }
  .install button.add { border: 0; border-radius: 9px; padding: 9px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; flex-shrink: 0; }
  .install button.add:hover { background: var(--accent-hover); }
  .install button.x { border: 0; background: none; color: var(--dim); font-size: 1.2rem;
    cursor: pointer; width: 44px; height: 44px; margin: -10px -10px -10px 0; line-height: 1; flex-shrink: 0; }
  .center { text-align: center; padding: 40px 10px; color: var(--dim); }
  .search { display: flex; gap: 8px; margin: 0 0 16px; }
  .search[hidden] { display: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search input { flex: 1; min-width: 0; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; }
  .search button.clear { border: 0; background: none; color: var(--dim); font-size: 1.2rem;
    cursor: pointer; padding: 0 4px; line-height: 1; }
  .shelfSentinel { height: 1px; }
  /* Reusable "what's new" spotlight — a pulsing ring on the feature itself
     plus a dismissable callout underneath. Generic by design: any future
     feature can reuse .spotlight-ring / .spotlight-bubble via
     spotlightFeature() in reader.js rather than a one-off banner each time. */
  .spotlight-ring { outline: 2px solid var(--accent); outline-offset: 4px;
    border-radius: 14px; animation: bhSpotlightPulse 1.8s ease-in-out infinite; }
  @keyframes bhSpotlightPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(241, 89, 42, 0.35); }
    50% { box-shadow: 0 0 0 9px rgba(241, 89, 42, 0); }
  }
  .spotlight-bubble { background: var(--surface); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; font-size: 0.88rem; }
  .spotlight-bubble .st { font-weight: 700; margin: 0 0 4px; }
  .spotlight-bubble .sb { color: var(--dim); margin: 0 0 10px; line-height: 1.5; }
  .spotlight-bubble button { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; }
  .spotlight-bubble button:hover { background: var(--accent-hover); }
  /* A tip anchored to the first tile sits under the first row of covers. */
  .grid > .spotlight-bubble { grid-column: 1 / -1; margin: 0; }
  #searchResults { margin: 0 0 24px; }
  #searchResults .center { text-align: center; padding: 24px 10px; color: var(--dim); }
  #searchResults h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--dim); }
  .watchForm { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .watchForm input { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 12px; font-size: 0.9rem; }
  /* Tap-a-book details modal. The tile itself is the trigger; the Send
     button inside it keeps its own behavior. */
  .tile { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.12); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  body.modal-open { overflow: hidden; }
  /* Book "mega view": a full-screen, see-through dialog. The page shows
     through a heavy blur; a big cover and the details float on top. A click
     on empty space (the dialog or its stage, not the content) closes it. */
  dialog.book { border: 0; padding: 0; margin: 0; background: transparent; color: var(--text);
    width: 100vw; max-width: none; height: 100dvh; max-height: none; overflow-y: auto; }
  dialog.book::backdrop { background: rgba(246, 241, 231, 0.62); backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3); }
  @media (prefers-color-scheme: dark) { dialog.book::backdrop { background: rgba(19, 26, 48, 0.62); } }
  dialog.book[open] { animation: bhFade 0.2s ease-out; }
  @keyframes bhFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bhRise { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { dialog.book[open], .book .art, .tile, .spotlight-ring { animation: none; transition: none; } }
  .book .card { min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: 76px 20px 32px; }
  .book .close, .book .nav { position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); width: 46px; height: 46px; z-index: 2;
    border: 1px solid rgba(231, 221, 200, 0.9); border-radius: 50%; background: rgba(255, 253, 248, 0.8); color: var(--text);
    font-size: 1.15rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  @media (prefers-color-scheme: dark) { .book .close, .book .nav { background: rgba(27, 36, 64, 0.8); border-color: rgba(43, 53, 87, 0.9); } }
  .book .close { right: max(16px, env(safe-area-inset-right, 0px)); }
  .book .nav { font-size: 1.7rem; padding-bottom: 3px; }
  .book .nav.prev { left: max(16px, env(safe-area-inset-left, 0px)); }
  .book .nav.next { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 54px); }
  .book .nav[hidden] { display: none; }
  .book .nav.prev[hidden] + .nav.next { left: max(16px, env(safe-area-inset-left, 0px)); }
  .book .close:focus-visible, .book .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .book .body { width: 100%; max-width: 960px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .book .art { width: min(72vw, 320px); flex-shrink: 0; animation: bhRise 0.32s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .book .art .cover { box-shadow: 0 26px 60px rgba(10, 16, 38, 0.38), 0 6px 16px rgba(10, 16, 38, 0.2); border-radius: 10px; }
  .book .art .cover.ph { font-size: 4rem; }
  .book .info { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
  .book h2 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.4rem); line-height: 1.1; text-wrap: balance; }
  .book .by { color: var(--dim); font-size: 1.05rem; font-weight: 600; }
  .book .desc { margin: 8px 0 4px; font-size: 1rem; line-height: 1.65; white-space: pre-line; }
  .book .desc.loading, .book .desc.none { color: var(--dim); font-style: italic; }
  .book .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .book button.send { padding: 14px; font-size: 1rem; box-shadow: 0 6px 18px rgba(241, 89, 42, 0.3); }
  .book button.send.sent, .book button.send.again { box-shadow: inset 0 0 0 1.5px currentColor; }
  .book .status { color: var(--dim); font-size: 0.9rem; line-height: 1.5; margin: 0; }
  .book .status[hidden] { display: none; }
  /* Phones: the description can run long, so the send action rides along at
     the bottom of the screen instead of hiding below the fold. */
  @media (max-width: 759px) {
    .book .actions { position: sticky; bottom: 0; z-index: 1; margin: 10px -20px -32px;
      padding: 14px 20px max(16px, env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--border);
      box-shadow: 0 -10px 24px -12px rgba(10, 16, 38, 0.25); }
  }
  @media (min-width: 760px) {
    .book .card { padding: 40px 88px; }
    .book .body { flex-direction: row; align-items: center; gap: 48px; }
    .book .art { width: min(36vw, 400px); }
    .book .nav { top: 50%; margin-top: -26px; width: 52px; height: 52px; font-size: 2rem; }
    .book .nav.next, .book .nav.prev[hidden] + .nav.next { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  footer { text-align: center; margin-top: 34px; font-size: 0.8rem; color: var(--dim); }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg class="mark" viewBox="28 20 200 224" aria-hidden="true" focusable="false"><path fill="currentColor" d="M68 28H128V212H68A16 16 0 0 1 52 196V44A16 16 0 0 1 68 28Z"/><path fill="currentColor" d="M184 28H188A16 16 0 0 1 204 44V196A16 16 0 0 1 188 212H184Z"/><path fill="#f1592a" d="M136 28H176V236L156 216L136 236Z"/></svg><span>Book<em>Hunt</em></span></div>
    <p id="greet">Opening your Library…</p>
  </header>
  <div id="banner"></div>
  <div id="install" class="install" hidden></div>
  <form id="searchForm" class="search" hidden>
    <input id="searchInput" type="search" aria-label="Search all books" placeholder="Search all books by title or author…"
           autocomplete="off" maxlength="300" enterkeyhint="search">
    <button type="button" id="searchClear" class="clear" hidden title="Clear search" aria-label="Clear search">✕</button>
  </form>
  <div id="searchResults"></div>
  <div id="main" class="center">Loading…</div>
  <footer id="foot" hidden>
    Tap “Send to my Kindle” and the book should show up on your Kindle within a few minutes.<br>
    <a href="#" id="unsub">Stop the new-book emails</a>
  </footer>
</div>
  <dialog id="bookDialog" class="book" aria-labelledby="bookTitle">
    <div class="card">
      <button type="button" id="bookClose" class="close" aria-label="Close">✕</button>
      <button type="button" id="bookPrev" class="nav prev" aria-label="Previous book">‹</button>
      <button type="button" id="bookNext" class="nav next" aria-label="Next book">›</button>
      <div class="body">
        <div id="bookCover" class="art"></div>
        <div class="info">
          <h2 id="bookTitle"></h2>
          <div id="bookAuthor" class="by"></div>
          <p id="bookDesc" class="desc"></p>
          <div class="actions">
            <p id="bookStatus" class="status" role="status" hidden></p>
            <button id="bookSend" type="button" class="send"></button>
            <div id="bookErr" class="err" role="alert"></div>
          </div>
        </div>
      </div>
    </div>
  </dialog>
<script src="/reader/app.js"></script>
</body>
</html>
