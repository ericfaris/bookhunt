<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your BookHunt shelf</title>
<meta name="theme-color" content="#1c2a56">
<!-- Home-screen install. The <link rel="manifest"> is injected by reader.js so
     it can carry the reader's token (Android/Chrome). iOS uses these apple-*
     tags + captures the current URL, so the token rides along there too. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BookHunt">
<link rel="apple-touch-icon" href="/reader/icon-180.png">
<link rel="icon" type="image/png" href="/reader/icon-192.png">
<style>
  :root {
    --bg: #f6f1e7; --surface: #fffdf8; --text: #1c2a56; --dim: #616a8c;
    --border: #e7ddc8; --accent: #f1592a; --accent-hover: #d8481c; --good: #1f9d57;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a30; --surface: #1b2440; --text: #eef1fa; --dim: #9aa3c4; --border: #2b3557; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; margin: 10px 0 22px; }
  header .logo { font-size: 1.5rem; font-weight: 800; }
  header .logo em { color: var(--accent); font-style: normal; }
  header p { color: var(--dim); margin: 6px 0 0; font-size: 0.95rem; }
  .note { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin: 0 0 16px; font-size: 0.95rem; }
  .note.warn { border-color: #c2871c; }
  .note button.add { border: 0; border-radius: 9px; padding: 9px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; }
  .note button.plain { border: 1px solid var(--border); border-radius: 9px; padding: 8px 14px;
    font-size: 0.85rem; cursor: pointer; background: none; color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px;
    background: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
  .cover.ph { display: flex; align-items: center; justify-content: center; font-size: 2rem; }
  .t { font-weight: 700; font-size: 0.9rem; line-height: 1.25; }
  .a { color: var(--dim); font-size: 0.8rem; }
  button.send { margin-top: auto; border: 0; border-radius: 9px; padding: 10px 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; }
  button.send:hover:not(:disabled) { background: var(--accent-hover); }
  button.send:disabled { opacity: 0.85; cursor: default; }
  button.send.sent { background: var(--good); }
  .err { color: #c0392b; font-size: 0.8rem; }
  /* Gentle, dismissable "add to home screen" hint — never a blocker. */
  .install { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; }
  .install[hidden] { display: none; }
  .install img { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; }
  .install .it { flex: 1; min-width: 0; }
  .install .it b { display: block; font-size: 0.95rem; }
  .install .it span { font-size: 0.82rem; color: var(--dim); }
  .install button.add { border: 0; border-radius: 9px; padding: 9px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; flex-shrink: 0; }
  .install button.add:hover { background: var(--accent-hover); }
  .install button.x { border: 0; background: none; color: var(--dim); font-size: 1.2rem;
    cursor: pointer; padding: 0 2px; line-height: 1; flex-shrink: 0; }
  .center { text-align: center; padding: 40px 10px; color: var(--dim); }
  .search { display: flex; gap: 8px; margin: 0 0 16px; }
  .search[hidden] { display: none; }
  .search input { flex: 1; min-width: 0; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; }
  .search button.clear { border: 0; background: none; color: var(--dim); font-size: 1.2rem;
    cursor: pointer; padding: 0 4px; line-height: 1; }
  .shelfSentinel { height: 1px; }
  /* Reusable "what's new" spotlight — a pulsing ring on the feature itself
     plus a dismissable callout underneath. Generic by design: any future
     feature can reuse .spotlight-ring / .spotlight-bubble via
     spotlightFeature() in reader.js rather than a one-off banner each time. */
  .spotlight-ring { outline: 2px solid var(--accent); outline-offset: 4px;
    border-radius: 14px; animation: bhSpotlightPulse 1.8s ease-in-out infinite; }
  @keyframes bhSpotlightPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(241, 89, 42, 0.35); }
    50% { box-shadow: 0 0 0 9px rgba(241, 89, 42, 0); }
  }
  .spotlight-bubble { background: var(--surface); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; font-size: 0.88rem; }
  .spotlight-bubble .st { font-weight: 700; margin: 0 0 4px; }
  .spotlight-bubble .sb { color: var(--dim); margin: 0 0 10px; line-height: 1.5; }
  .spotlight-bubble button { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer; background: var(--accent); color: #fff; }
  .spotlight-bubble button:hover { background: var(--accent-hover); }
  #searchResults { margin: 0 0 24px; }
  #searchResults .center { text-align: center; padding: 24px 10px; color: var(--dim); }
  #searchResults h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--dim); }
  .watchForm { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .watchForm input { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 12px; font-size: 0.9rem; }
  /* Tap-a-book details modal. The tile itself is the trigger; the Send
     button inside it keeps its own behavior. */
  .tile { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.12); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  body.modal-open { overflow: hidden; }
  dialog.book { border: 0; padding: 0; background: transparent; color: var(--text);
    width: min(560px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 32px); }
  dialog.book::backdrop { background: rgba(10, 14, 30, 0.6); backdrop-filter: blur(3px); }
  dialog.book[open] { animation: bhPop 0.18s ease-out; }
  @keyframes bhPop { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { dialog.book[open], .tile { animation: none; transition: none; } }
  .book .card { position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 20px 20px; max-height: calc(100dvh - 32px); overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .book .close { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0;
    border-radius: 50%; background: var(--bg); color: var(--text); font-size: 1.2rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .book .close:hover { background: var(--border); }
  .book .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .book .body { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .book .art { width: min(220px, 62vw); flex-shrink: 0; }
  .book .art .cover { box-shadow: 0 10px 28px rgba(0,0,0,0.28); }
  .book .art .cover.ph { font-size: 3.5rem; }
  .book .info { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .book h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; padding-right: 36px; }
  .book .by { color: var(--dim); font-size: 0.95rem; }
  .book .desc { margin: 10px 0 6px; font-size: 0.95rem; line-height: 1.6; white-space: pre-line; }
  .book .desc.loading, .book .desc.none { color: var(--dim); font-style: italic; }
  .book button.send { margin-top: 8px; padding: 12px; font-size: 0.95rem; }
  @media (min-width: 600px) {
    .book .card { padding: 26px; }
    .book .body { flex-direction: row; align-items: flex-start; }
    .book .art { width: 200px; }
  }
  footer { text-align: center; margin-top: 34px; font-size: 0.8rem; color: var(--dim); }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Book<em>Hunt</em> 📚</div>
    <p id="greet">Opening your shelf…</p>
  </header>
  <div id="banner"></div>
  <div id="install" class="install" hidden></div>
  <form id="searchForm" class="search" hidden>
    <input id="searchInput" type="search" placeholder="Search all books by title or author…"
           autocomplete="off" maxlength="300" enterkeyhint="search">
    <button type="button" id="searchClear" class="clear" hidden title="Clear search">✕</button>
  </form>
  <div id="searchResults"></div>
  <div id="main" class="center">Loading…</div>
  <footer id="foot" hidden>
    Tap “Send to my Kindle” and the book arrives in your Kindle library in a few minutes.<br>
    <a href="#" id="unsub">Stop the new-book emails</a>
  </footer>
</div>
  <dialog id="bookDialog" class="book" aria-labelledby="bookTitle">
    <div class="card">
      <button type="button" id="bookClose" class="close" aria-label="Close">✕</button>
      <div class="body">
        <div id="bookCover" class="art"></div>
        <div class="info">
          <h2 id="bookTitle"></h2>
          <div id="bookAuthor" class="by"></div>
          <p id="bookDesc" class="desc"></p>
          <button id="bookSend" type="button" class="send"></button>
          <div id="bookErr" class="err"></div>
        </div>
      </div>
    </div>
  </dialog>
<script src="/reader/app.js"></script>
</body>
</html>
